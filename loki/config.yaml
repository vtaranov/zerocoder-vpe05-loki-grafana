auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 1
  delete_request_store: filesystem
limits_config:
  retention_period: 24h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_global_streams_per_user: 100
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
  max_query_lookback: 24h
  max_entries_limit_per_query: 1000
  split_queries_by_interval: 15m
  reject_old_samples: true
  reject_old_samples_max_age: 24h
querier:
  max_concurrent: 2
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 30m
  chunk_target_size: 262144
  wal:
    dir: /loki/wal
    replay_memory_ceiling: 128MB
analytics:
  reporting_enabled: false
